<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>2026 DIGITAL BUHOU</title>
<style>
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;

   background:#000;

    font-family:Arial,sans-serif;
}
.home{
    position:fixed;
    top:20px;
    left:20px;
    z-index:1000;

    padding:12px 22px;

    background:rgba(255,255,255,.88);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-radius:999px;

    color:#111;
    text-decoration:none;
    font-weight:600;

    box-shadow:
        0 8px 24px rgba(0,0,0,.35);

    transition:all .25s ease;
}

.home:hover{
    transform:translateY(-2px);
    box-shadow:
        0 14px 36px rgba(0,0,0,.45);
}
#book{width:100vw;height:100vh;}
.page{
    background:#000;

    border-radius:6px;

    overflow:hidden;

    box-shadow:
        0 18px 60px rgba(0,0,0,.45),
        0 6px 18px rgba(0,0,0,.25);
}
.page img{
    width:100%;
    height:100%;
    object-fit:contain;
    background:transparent;
    display:block;
}
    #pageNumber{

position:fixed;

bottom:24px;

left:50%;

transform:translateX(-50%);

background:rgba(0,0,0,.55);

backdrop-filter:blur(12px);

padding:10px 20px;

border-radius:999px;

color:white;

font-size:15px;

font-weight:600;

letter-spacing:1px;

z-index:9999;

box-shadow:
0 8px 20px rgba(0,0,0,.35);

}
    #zoomControls{

position:fixed;

top:20px;

right:20px;

display:flex;

gap:10px;

z-index:9999;

}

#zoomControls button{

width:48px;

height:48px;

border:none;

border-radius:50%;

background:rgba(255,255,255,.9);

backdrop-filter:blur(12px);

font-size:24px;

font-weight:bold;

cursor:pointer;

box-shadow:
0 8px 20px rgba(0,0,0,.35);

transition:.2s;

}

#zoomControls button:hover{

transform:scale(1.08);

}
</style>
</head>
<body>

<a class="home" href="index.html">← HOME</a>

<div id="book"></div>

<div id="pageNumber">
1 / 32
</div>

<script src="page-flip.browser.min.js"></script>
<script>
const book = document.getElementById("book");

for(let i=1;i<=32;i++){
  const p=document.createElement("div");
  p.className="page";
  const img=document.createElement("img");
  img.src=`images/${i}.png`;
  img.alt=`Page ${i}`;
  p.appendChild(img);
  book.appendChild(p);
}

const pageFlip = new St.PageFlip(book,{
  width:700,
  height:990,
  size:"stretch",
  minWidth:315,
  maxWidth:1200,
  minHeight:420,
  maxHeight:1600,
  showCover:true,
  usePortrait:true,
  mobileScrollSupport:true,
  startPage:0,
  autoSize:true,
  maxShadowOpacity:0.5
});

pageFlip.loadFromHTML(document.querySelectorAll(".page"));
    const pageNumber = document.getElementById("pageNumber");

pageFlip.on("flip", (e)=>{

pageNumber.innerHTML =
`${e.data + 1} / 32`;

});
    
  // 2本指ピンチ ＋ 拡大中の1本指スクロール

let pinchStartDistance = 0;
let currentScale = 1;

let translateX = 0;
let translateY = 0;

let lastX = 0;
let lastY = 0;

let isPanning = false;


function getDistance(touches){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(dx * dx + dy * dy);
}


function updateTransform(){

    book.style.transform =
        `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;

}


/* タッチ開始 */

book.addEventListener("touchstart", function(e){

    /* 拡大中 ＋ 1本指 → 移動 */

    if(
        currentScale > 1 &&
        e.touches.length === 1
    ){

        isPanning = true;

        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;

        e.preventDefault();

        return;
    }


    /* 2本指 → ピンチ開始 */

    if(e.touches.length === 2){

        pinchStartDistance =
            getDistance(e.touches);

        isPanning = false;

        e.preventDefault();

    }

}, {
    passive:false,
    capture:true
});


/* タッチ移動 */

book.addEventListener("touchmove", function(e){

    /* 拡大中の1本指移動 */

    if(
        currentScale > 1 &&
        e.touches.length === 1 &&
        isPanning
    ){

        const x =
            e.touches[0].clientX;

        const y =
            e.touches[0].clientY;


        translateX +=
            x - lastX;

        translateY +=
            y - lastY;


        lastX = x;
        lastY = y;


        updateTransform();

        e.preventDefault();

        return;
    }


    /* 2本指ピンチ */

    if(e.touches.length === 2){

        e.preventDefault();

        const distance =
            getDistance(e.touches);


        if(pinchStartDistance > 0){

            const ratio =
                distance / pinchStartDistance;


            currentScale *= ratio;


            currentScale =
                Math.min(
                    Math.max(currentScale, 1),
                    2
                );


            updateTransform();


            pinchStartDistance =
                distance;
        }

    }

}, {
    passive:false,
    capture:true
});


/* タッチ終了 */

book.addEventListener("touchend", function(e){

    if(e.touches.length === 0){

        pinchStartDistance = 0;

        isPanning = false;

    }

}, {
    passive:false,
    capture:true
});
</script>

</body>
</html>
