<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 DIGITAL BUHOU</title>

<style>
html,body{
    margin:0;
    height:100%;
    background:#1f1f1f;
    overflow:hidden;
    font-family:Arial,sans-serif;
}
#book{
    width:100vw;
    height:100vh;
}
.home{
    position:fixed;
    top:16px;
    left:16px;
    z-index:1000;
    background:#fff;
    color:#222;
    text-decoration:none;
    padding:10px 16px;
    border-radius:999px;
    font-weight:bold;
    box-shadow:0 2px 10px rgba(0,0,0,.25);
}
</style>
</head>
<body>

<a class="home" href="index.html">← HOME</a>

<div id="book"></div>

<script src="page-flip.browser.min.js"></script>

<script>
const pageFlip = new St.PageFlip(
    document.getElementById("book"),
    {
        width:700,
        height:990,
        size:"stretch",
        minWidth:315,
        maxWidth:1000,
        minHeight:420,
        maxHeight:1400,
        showCover:true,
        mobileScrollSupport:true,
        useMouseEvents:true
    }
);

const pages = [];
for(let i=1;i<=32;i++){
    pages.push(`images/${i}.png`);
}

pageFlip.loadFromImages(pages);
</script>

</body>
</html>
