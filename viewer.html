<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 DIGITAL BUHOU</title>
<style>
html,body{margin:0;height:100%;background:#2b2b2b;font-family:Arial,sans-serif;}
.home{
position:fixed;left:16px;top:16px;z-index:1000;
background:#fff;padding:10px 16px;border-radius:999px;
text-decoration:none;color:#222;font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.25)
}
#book{width:100vw;height:100vh;}
.page{background:#fff;}
.page img{width:100%;height:100%;object-fit:contain;}
</style>
</head>
<body>

<a class="home" href="index.html">← HOME</a>
<div id="book"></div>

<script src="page-flip.browser.min.js"></script>
<script>
const book = document.getElementById("book");

for(let i=1;i<=32;i++){
  const p=document.createElement("div");
  p.className="page";
  const img=document.createElement("img");
  img.src=`images/${i}.png`;
  img.alt=`Page ${i}`;
  p.appendChild(img);
  book.appendChild(p);
}

const pageFlip = new St.PageFlip(book,{
  width:700,
  height:990,
  size:"stretch",
  minWidth:315,
  maxWidth:1200,
  minHeight:420,
  maxHeight:1600,
  showCover:true,
  usePortrait:true,
  mobileScrollSupport:true,
  startPage:0,
  autoSize:true,
  maxShadowOpacity:0.5
});

pageFlip.loadFromHTML(document.querySelectorAll(".page"));
</script>

</body>
</html>
