<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>2026 DIGITAL BUHOU</title>
<style>
html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;

   background:#000;

    font-family:Arial,sans-serif;
}
.home{
    position:fixed;
    top:20px;
    left:20px;
    z-index:1000;

    padding:12px 22px;

    background:rgba(255,255,255,.88);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    border-radius:999px;

    color:#111;
    text-decoration:none;
    font-weight:600;

    box-shadow:
        0 8px 24px rgba(0,0,0,.35);

    transition:all .25s ease;
}

.home:hover{
    transform:translateY(-2px);
    box-shadow:
        0 14px 36px rgba(0,0,0,.45);
}
#book{
    width:100vw;
    height:100vh;
    touch-action:none;
}
.page{
    background:#000;

    border-radius:6px;

    overflow:hidden;

    box-shadow:
        0 18px 60px rgba(0,0,0,.45),
        0 6px 18px rgba(0,0,0,.25);
}
.page img{
    width:100%;
    height:100%;
    object-fit:contain;
    background:transparent;
    display:block;
}
    #pageNumber{

position:fixed;

bottom:24px;

left:50%;

transform:translateX(-50%);

background:rgba(0,0,0,.55);

backdrop-filter:blur(12px);

padding:10px 20px;

border-radius:999px;

color:white;

font-size:15px;

font-weight:600;

letter-spacing:1px;

z-index:9999;

box-shadow:
0 8px 20px rgba(0,0,0,.35);

}
    #zoomControls{

position:fixed;

top:20px;

right:20px;

display:flex;

gap:10px;

z-index:9999;

}

#zoomControls button{

width:48px;

height:48px;

border:none;

border-radius:50%;

background:rgba(255,255,255,.9);

backdrop-filter:blur(12px);

font-size:24px;

font-weight:bold;

cursor:pointer;

box-shadow:
0 8px 20px rgba(0,0,0,.35);

transition:.2s;

}

#zoomControls button:hover{

transform:scale(1.08);

}
</style>
</head>
<body>

<a class="home" href="index.html">← HOME</a>

<div id="book"></div>

<div id="pageNumber">
1 / 32
</div>

<script src="page-flip.browser.min.js"></script>
<script>
const book = document.getElementById("book");

/* =========================
   ページを作る
========================= */

for(let i = 1; i <= 32; i++){

    const p = document.createElement("div");

    p.className = "page";

    const img = document.createElement("img");

    img.src = `images/${i}.png`;

    img.alt = `Page ${i}`;

    p.appendChild(img);

    book.appendChild(p);
}


/* =========================
   PageFlip
========================= */

const isMobile =
    window.matchMedia("(hover: none) and (pointer: coarse)").matches;
const isPC =
    window.matchMedia("(hover: hover) and (pointer: fine)").matches;

const pageFlip = new St.PageFlip(book, {

    width:700,

    height:990,

    size:"stretch",

    minWidth:315,

    maxWidth:1200,

    minHeight:420,

    maxHeight:1600,

    showCover:true,

    usePortrait:true,

    mobileScrollSupport:true,

    startPage:0,

    autoSize:true,

    maxShadowOpacity:0.25,

      useMouseEvents: !isMobile,

    /*
      スマホではPageFlip自身に
      タッチ操作をさせない。

      PCでは今まで通り
      マウス操作を使う。
    */

    swipeDistance:50

});


pageFlip.loadFromHTML(
    document.querySelectorAll(".page")
);


/* =========================
   ページ番号
========================= */

const pageNumber =
    document.getElementById("pageNumber");


pageFlip.on("flip", (e)=>{

    pageNumber.innerHTML =
        `${e.data + 1} / 32`;

});


/* =========================
   スマホ操作
========================= */

if(!isMobile){

    let startX = 0;

    let startY = 0;

    let lastX = 0;

    let lastY = 0;

    let pinchStartDistance = 0;

    let currentScale = 1;

    let translateX = 0;

    let translateY = 0;

    let isPinching = false;

    let isPanning = false;

    let wasTwoFinger = false;


    /* 2本の指の距離 */

    function getDistance(touches){

        const dx =
            touches[0].clientX -
            touches[1].clientX;

        const dy =
            touches[0].clientY -
            touches[1].clientY;

        return Math.sqrt(
            dx * dx + dy * dy
        );

    }


    /* 表示位置を更新 */

    function updateTransform(){

        book.style.transform =
            `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;

    }


    /* =========================
       タッチ開始
    ========================= */

    book.addEventListener(
        "touchstart",
        function(e){

            /*
              2本指になった瞬間、
              ページめくり候補を完全キャンセル
            */

            if(e.touches.length >= 2){

                wasTwoFinger = true;

                isPinching = true;

                isPanning = false;

                pinchStartDistance =
                    getDistance(e.touches);

                e.preventDefault();

                return;
            }


            /*
              1本指
            */

            if(e.touches.length === 1){

                startX =
                    e.touches[0].clientX;

                startY =
                    e.touches[0].clientY;

                lastX = startX;

                lastY = startY;

                /*
                  ズーム中なら移動
                */

                if(currentScale > 1){

                    isPanning = true;

                }

            }

        },
        {
            passive:false
        }
    );


    /* =========================
       タッチ移動
    ========================= */

    book.addEventListener(
        "touchmove",
        function(e){

            /*
              2本指
              ↓
              ズームだけ
            */

            if(
                e.touches.length >= 2 ||
                isPinching
            ){

                if(e.touches.length < 2){

                    return;

                }


                const distance =
                    getDistance(e.touches);


                if(pinchStartDistance > 0){

                    const ratio =
                        distance /
                        pinchStartDistance;


                    currentScale *= ratio;


                    currentScale =
                        Math.min(
                            Math.max(
                                currentScale,
                                1
                            ),
                            2
                        );


                    /*
                      1倍に戻ったら
                      必ず中央へ
                    */

                    if(currentScale <= 1.01){

                        currentScale = 1;

                        translateX = 0;

                        translateY = 0;

                    }


                    updateTransform();


                    pinchStartDistance =
                        distance;

                }


                e.preventDefault();

                return;
            }


            /*
              ズーム中の1本指
              ↓
              ページを移動
            */

            if(
                currentScale > 1 &&
                isPanning &&
                e.touches.length === 1
            ){

                const x =
                    e.touches[0].clientX;

                const y =
                    e.touches[0].clientY;


                translateX +=
                    x - lastX;


                translateY +=
                    y - lastY;


                lastX = x;

                lastY = y;


                updateTransform();


                e.preventDefault();

            }

        },
        {
            passive:false
        }
    );


    /* =========================
       タッチ終了
    ========================= */

    book.addEventListener(
        "touchend",
        function(e){

            /*
              まだ指が残っている場合
            */

            if(e.touches.length > 0){

                return;

            }


            /*
              2本指操作だった場合

              ★ここでは絶対に
              ページをめくらない
            */

            if(wasTwoFinger){

                isPinching = false;

                isPanning = false;

                pinchStartDistance = 0;

                wasTwoFinger = false;

                return;

            }


            /*
              ズーム中の1本指操作は
              ページめくりしない
            */

            if(currentScale > 1){

                isPanning = false;

                return;

            }


            /*
              通常時の1本指
              ↓
              スワイプ判定
            */

            const endX =
                e.changedTouches[0].clientX;

            const endY =
                e.changedTouches[0].clientY;


            const deltaX =
                endX - startX;

            const deltaY =
                endY - startY;


            /*
              横方向の移動が
              縦方向より大きい場合だけ
              ページめくり
            */

            if(
                Math.abs(deltaX) > 50 &&
                Math.abs(deltaX) >
                Math.abs(deltaY)
            ){

                /*
                  左へスワイプ
                  → 次のページ
                */

                if(deltaX < 0){

                    pageFlip.flipNext();

                }


                /*
                  右へスワイプ
                  → 前のページ
                */

                else{

                    pageFlip.flipPrev();

                }

            }


            isPanning = false;

        },
        {
            passive:false
        }
    );

}
    /* =========================
   PC専用：クリックでページ移動
   ※ドラッグ操作はそのまま残す
========================= */

if(!isTouchDevice){

    let mouseStartX = 0;
    let mouseStartY = 0;
    let mouseMoved = false;

    book.addEventListener("mousedown", function(e){

        mouseStartX = e.clientX;
        mouseStartY = e.clientY;
        mouseMoved = false;

    });

    book.addEventListener("mousemove", function(e){

        const moveX =
            Math.abs(e.clientX - mouseStartX);

        const moveY =
            Math.abs(e.clientY - mouseStartY);

        if(moveX > 8 || moveY > 8){

            mouseMoved = true;

        }

    });

    book.addEventListener("click", function(e){

        /*
          マウスをドラッグした場合は
          PageFlipに任せる
        */

        if(mouseMoved){

            mouseMoved = false;

            return;

        }

        const rect =
            book.getBoundingClientRect();

        const clickX =
            e.clientX - rect.left;

        const center =
            rect.width / 2;


        /*
          右半分 → 次のページ
        */

        if(clickX > center){

            pageFlip.flipNext();

        }

        /*
          左半分 → 前のページ
        */

        else{

            pageFlip.flipPrev();

        }

    });

}
</script>

</body>
</html>
