<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>2026 DIGITAL BUHOU | 関西学院大学体育会スキー競技部</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      font-family: Arial, "Noto Sans JP", sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(120, 150, 180, 0.28) 0%,
          rgba(40, 55, 70, 0.18) 25%,
          rgba(8, 12, 18, 0.85) 65%,
          #05070a 100%
        ),
        linear-gradient(
          135deg,
          #182531 0%,
          #080c11 55%,
          #030405 100%
        );
    }

    /* 雪山をイメージした光 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        linear-gradient(
          115deg,
          transparent 35%,
          rgba(255,255,255,0.07) 50%,
          transparent 65%
        );

      opacity: 0.8;
    }

    .page {
      width: 100%;
      height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      position: relative;
      padding: 30px 20px;
    }

    /* 上のタイトル */
    .title-area {
      text-align: center;
      margin-bottom: 25px;

      animation: fadeDown 1s ease forwards;
    }

    .small-title {
      font-size: 12px;
      letter-spacing: 5px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 4vw, 52px);
      font-weight: 300;

      letter-spacing: 7px;

      text-shadow:
        0 4px 20px rgba(0,0,0,0.5);
    }

    .subtitle {
      margin-top: 12px;

      font-size: 13px;
      letter-spacing: 3px;

      opacity: 0.75;
    }

    /* 表紙 */
    .cover-area {
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;

      animation: coverAppear 1.2s ease forwards;
    }

    .cover-area::before {
      content: "";

      position: absolute;

      width: 120%;
      height: 115%;

      background:
        radial-gradient(
          ellipse,
          rgba(255,255,255,0.22),
          transparent 65%
        );

      filter: blur(30px);

      z-index: -1;
    }

    .cover {
      display: block;

      width: min(360px, 72vw);
      max-height: 58vh;

      object-fit: contain;

      border-radius: 4px;

      cursor: pointer;

      box-shadow:
        0 35px 80px rgba(0,0,0,0.7),
        0 12px 30px rgba(0,0,0,0.5);

      transition:
        transform 0.45s ease,
        box-shadow 0.45s ease;
    }

    .cover:hover {
      transform: translateY(-8px) scale(1.025);

      box-shadow:
        0 45px 100px rgba(0,0,0,0.8),
        0 18px 40px rgba(0,0,0,0.6);
    }

    /* ボタン */
    .open-button {
      margin-top: 28px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-width: 230px;
      padding: 14px 28px;

      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px;

      color: #fff;
      text-decoration: none;

      background: rgba(255,255,255,0.08);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 3px;

      box-shadow:
        0 12px 30px rgba(0,0,0,0.35);

      transition: all 0.3s ease;

      animation: fadeUp 1.2s ease forwards;
    }

    .open-button:hover {
      background: rgba(255,255,255,0.18);

      border-color: rgba(255,255,255,0.65);

      transform: translateY(-3px);

      box-shadow:
        0 18px 40px rgba(0,0,0,0.5);
    }

    .open-button span {
      margin-right: 10px;
      font-size: 17px;
    }

    /* 下のアクセント */
    .bottom-line {
      position: absolute;

      bottom: 24px;

      width: min(500px, 70vw);

      height: 1px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.35),
          transparent
        );
    }

    .since {
      position: absolute;

      bottom: 8px;

      font-size: 9px;

      letter-spacing: 3px;

      opacity: 0.4;
    }

    @keyframes coverAppear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* スマホ */
    @media (max-width: 600px) {

      .page {
        padding: 20px 15px;
      }

      .small-title {
        font-size: 9px;
        letter-spacing: 3px;
      }

      h1 {
        font-size: 26px;
        letter-spacing: 4px;
      }

      .subtitle {
        font-size: 10px;
        letter-spacing: 2px;
      }

      .title-area {
        margin-bottom: 18px;
      }

      .cover {
        width: min(300px, 78vw);
        max-height: 52vh;
      }

      .open-button {
        margin-top: 22px;
        min-width: 210px;
        padding: 13px 22px;
        font-size: 11px;
      }

      .bottom-line {
        bottom: 20px;
      }

      .since {
        bottom: 5px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="title-area">

      <div class="small-title">
        KANSEI GAKUIN UNIVERSITY SKI TEAM
      </div>

      <h1>2026 DIGITAL BUHOU</h1>

      <div class="subtitle">
        関西学院大学体育会スキー競技部
      </div>

    </div>

    <div class="cover-area">

      <img
        src="cover.png"
        class="cover"
        alt="2026 DIGITAL BUHOU 表紙"
        onclick="openBook()"
      >

    </div>

    <a
      href="viewer.html"
      class="open-button"
    >
      <span>📖</span>
      OPEN DIGITAL BUHOU
    </a>

    <div class="bottom-line"></div>

    <div class="since">
      SINCE 1889
    </div>

  </main>

  <script>
    function openBook() {
      window.location.href = "viewer.html";
    }
  </script>

</body>
</html>
