<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026 部報 | 関西学院大学体育会スキー競技部</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;

    color:#fff;

    background:

        radial-gradient(
            ellipse at 50% 35%,
            rgba(45,70,90,.45) 0%,
            rgba(15,25,35,.35) 35%,
            transparent 65%
        ),

        radial-gradient(
            ellipse at 50% 75%,
            rgba(210,160,75,.14),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #08111b 0%,
            #03070b 65%,
            #010203 100%
        );
}


/* 上から差し込む光 */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            115deg,
            transparent 25%,
            rgba(255,255,255,.07) 42%,
            transparent 58%
        );

    opacity:.8;
}


/* 下の床 */

body::after{

    content:"";

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:22%;

    pointer-events:none;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(0,0,0,.5)
        );

    border-top:
        1px solid rgba(255,255,255,.04);
}


/* 全体 */

.page{

    width:100%;
    height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    position:relative;

    padding:20px;

}


/* タイトル */

.header{

    text-align:center;

    margin-bottom:22px;

    z-index:2;

    animation:
        fadeDown 1s ease forwards;

}


.team-name{

    font-family:Arial,sans-serif;

    font-size:
        clamp(9px,1.2vw,14px);

    letter-spacing:5px;

    color:#e3c477;

    margin-bottom:12px;

    font-weight:500;

}


.title{

    margin:0;

    font-size:
        clamp(42px,5.5vw,72px);

    font-weight:400;

    letter-spacing:8px;

    line-height:1;

    text-shadow:
        0 5px 30px rgba(0,0,0,.7);

}


.subtitle{

    margin-top:15px;

    font-size:
        clamp(11px,1.3vw,15px);

    letter-spacing:4px;

    opacity:.9;

}


/* ゴールドライン */

.gold-line{

    width:
        min(420px,60vw);

    height:1px;

    margin:18px auto 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d7b663,
            transparent
        );

    box-shadow:
        0 0 10px rgba(215,182,99,.35);

}


/* 表紙エリア */

.cover-area{

    position:relative;

    z-index:2;

    display:flex;

    justify-content:center;

    align-items:center;

    animation:
        coverAppear 1.1s ease forwards;

}


/* 表紙の後ろの光 */

.cover-area::before{

    content:"";

    position:absolute;

    width:130%;

    height:125%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,215,140,.18),
            transparent 65%
        );

    filter:blur(35px);

    z-index:-2;

}


/* 床に落ちる影 */

.cover-area::after{

    content:"";

    position:absolute;

    left:8%;

    right:8%;

    bottom:-22px;

    height:35px;

    background:
        radial-gradient(
            ellipse,
            rgba(0,0,0,.85),
            transparent 70%
        );

    filter:blur(12px);

    z-index:-1;

}


/* 雑誌本体 */

.cover{

    display:block;

    height:min(53vh, 620px);

    width:auto;

    max-width:78vw;

    object-fit:contain;

    cursor:pointer;

    border-radius:2px;

    box-shadow:
        0 35px 70px rgba(0,0,0,.75),
        0 12px 25px rgba(0,0,0,.55),
        0 0 1px rgba(255,255,255,.7);

    transition:
        transform .4s ease,
        box-shadow .4s ease;
}

    border-radius:2px;

    /*
      正面のまま、ほんの少しだけ
      雑誌の厚みを感じる立体感
    */

    box-shadow:

        0 35px 70px rgba(0,0,0,.75),

        0 12px 25px rgba(0,0,0,.55),

        0 0 1px rgba(255,255,255,.7);

    transition:
        transform .4s ease,
        box-shadow .4s ease;

}


/* 表紙にカーソルを乗せた時 */

.cover:hover{

    transform:
        translateY(-7px)
        scale(1.015);
            .cover:active{

    transform:
        translateY(-7px)
        scale(1.03);

    box-shadow:

        0 45px 90px rgba(0,0,0,.85),

        0 18px 35px rgba(0,0,0,.65),

        0 0 25px rgba(255,210,120,.12);
}

    box-shadow:

        0 45px 90px rgba(0,0,0,.85),

        0 18px 35px rgba(0,0,0,.65),

        0 0 25px rgba(255,210,120,.12);

}


/* OPEN */

.open-button{

    position:relative;

    z-index:3;

    margin-top:25px;

    width:220px;

    padding:14px 20px;

    display:flex;

    justify-content:center;

    align-items:center;

    text-decoration:none;

    color:#e7cb86;

    font-family:Arial,sans-serif;

    font-size:14px;

    font-weight:500;

    letter-spacing:7px;

    background:
        rgba(5,8,12,.78);

    border:
        1px solid #d7b663;

    border-radius:999px;

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px);

    box-shadow:

        0 12px 30px rgba(0,0,0,.5),

        0 0 18px rgba(215,182,99,.08);

    transition:.3s ease;

}


.open-button:hover{

    color:#fff;

    background:
        rgba(215,182,99,.13);

    transform:
        translateY(-3px);

    box-shadow:

        0 18px 40px rgba(0,0,0,.65),

        0 0 25px rgba(215,182,99,.18);

}


/* 下の説明 */

.description{

    position:relative;

    z-index:3;

    margin-top:13px;

    font-size:11px;

    letter-spacing:2px;

    opacity:.65;

}


/* アニメーション */

@keyframes fadeDown{

    from{

        opacity:0;

        transform:translateY(-18px);

    }

    to{

        opacity:1;

        transform:translateY(0);

    }

}


@keyframes coverAppear{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.96);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* スマホ */

@media(max-width:600px){

    .page{

        padding:15px;

    }

    .header{

        margin-bottom:15px;

    }

    .team-name{

        font-size:8px;

        letter-spacing:3px;

    }

    .title{

        font-size:34px;

        letter-spacing:5px;

    }

    .subtitle{

        font-size:10px;

        letter-spacing:2px;

        margin-top:10px;

    }

    .gold-line{

        width:65vw;

        margin-top:12px;

    }

   .cover{

    height:52vh;

    width:auto;

    max-width:82vw;

}

    .open-button{

        width:180px;

        padding:12px;

        margin-top:20px;

        font-size:12px;

        letter-spacing:5px;

    }

    .description{

        font-size:8px;

        letter-spacing:1px;

    }

}

</style>
</head>


<body>

<main class="page">


    <!-- タイトル -->

    <div class="header">

        <div class="team-name">
            KWANSEI GAKUIN UNIVERSITY SKI TEAM
        </div>

        <h1 class="title">
            2026 部報
        </h1>

        <div class="subtitle">
            関西学院大学体育会スキー競技部
        </div>

        <div class="gold-line"></div>

    </div>


    <!-- 雑誌 -->

    <div class="cover-area">

        <img
            src="cover.png"
            class="cover"
            alt="2026 部報 表紙"
            onclick="openBook()"
        >

    </div>


    <!-- OPEN -->

    <a
        href="viewer.html"
        class="open-button"
    >
        OPEN
    </a>


    <!-- 説明 -->

    <div class="description">
        表紙をクリック、またはOPENをクリックしてご覧ください
    </div>


</main>


<script>

function openBook(){

    window.location.href="viewer.html";

}

</script>


</body>
</html>
