<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026 部報 | 関西学院大学体育会スキー競技部</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{

    overflow:hidden;

    font-family:
        "Times New Roman",
        "Yu Mincho",
        "Hiragino Mincho ProN",
        serif;

    color:white;

    background:

        radial-gradient(
            circle at 50% 60%,
            rgba(180,140,80,.18),
            transparent 28%
        ),

        radial-gradient(
            circle at 50% 35%,
            rgba(50,80,110,.35),
            transparent 50%
        ),

        linear-gradient(
            135deg,
            #182738 0%,
            #0b121b 45%,
            #030507 100%
        );
}


/* 光の演出 */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at 50% 70%,
            rgba(255,190,100,.16),
            transparent 30%
        );

    filter:blur(20px);

}


/* メイン */

.page{

    width:100%;
    height:100vh;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    position:relative;

    padding:20px;

}


/* 上部 */

.header{

    text-align:center;

    margin-bottom:25px;

    animation:
        fadeDown 1s ease forwards;

}


.team-name{

    font-family:
        Arial,
        sans-serif;

    font-size:
        clamp(9px,1.2vw,14px);

    letter-spacing:
        5px;

    color:
        #e8c987;

    margin-bottom:12px;

    font-weight:500;

}


.title{

    margin:0;

    font-size:
        clamp(38px,5vw,68px);

    font-weight:400;

    letter-spacing:
        8px;

    line-height:1;

    text-shadow:
        0 5px 30px rgba(0,0,0,.6);

}


.subtitle{

    margin-top:15px;

    font-size:
        clamp(11px,1.3vw,15px);

    letter-spacing:
        4px;

    opacity:.85;

}


/* ゴールドライン */

.gold-line{

    width:
        min(330px,55vw);

    height:1px;

    margin-top:18px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #d9b86c,
            transparent
        );

}


/* 表紙 */

.cover-area{

    position:relative;

    display:flex;

    justify-content:center;

    align-items:center;

    animation:
        coverAppear 1.2s ease forwards;

}


/* 表紙の光 */

.cover-area::before{

    content:"";

    position:absolute;

    width:140%;

    height:120%;

    background:

        radial-gradient(
            ellipse,
            rgba(255,210,130,.18),
            transparent 65%
        );

    filter:blur(35px);

    z-index:-1;

}


/* 表紙 */

.cover{

    display:block;

    width:
        min(360px,68vw);

    max-height:
        55vh;

    object-fit:
        contain;

    border-radius:3px;

    cursor:pointer;

    box-shadow:

        0 40px 100px rgba(0,0,0,.75),

        0 15px 35px rgba(0,0,0,.55),

        0 0 40px rgba(255,210,130,.08);

    transition:
        transform .45s ease,
        box-shadow .45s ease;

}


/* マウスを乗せたとき */

.cover:hover{

    transform:
        translateY(-8px)
        scale(1.025);

    box-shadow:

        0 50px 110px rgba(0,0,0,.85),

        0 20px 45px rgba(0,0,0,.65),

        0 0 60px rgba(255,210,130,.15);

}


/* OPENボタン */

.open-button{

    margin-top:25px;

    min-width:190px;

    padding:14px 45px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    color:#f4dfad;

    font-family:
        Arial,
        sans-serif;

    font-size:14px;

    font-weight:500;

    letter-spacing:6px;

    background:
        rgba(5,8,12,.72);

    border:
        1px solid #d9b86c;

    border-radius:999px;

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    box-shadow:

        0 15px 35px rgba(0,0,0,.45),

        0 0 20px rgba(217,184,108,.08);

    transition:
        all .3s ease;

}


/* ボタンホバー */

.open-button:hover{

    color:white;

    background:
        rgba(217,184,108,.15);

    box-shadow:

        0 20px 45px rgba(0,0,0,.6),

        0 0 30px rgba(217,184,108,.15);

    transform:
        translateY(-3px);

}


/* 下の説明 */

.description{

    margin-top:14px;

    font-family:
        "Yu Mincho",
        serif;

    font-size:11px;

    letter-spacing:2px;

    opacity:.65;

}


/* アニメーション */

@keyframes fadeDown{

    from{

        opacity:0;

        transform:
            translateY(-20px);

    }

    to{

        opacity:1;

        transform:
            translateY(0);

    }

}


@keyframes coverAppear{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.96);

    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* スマホ */

@media(max-width:600px){

    .page{

        padding:
            15px;

    }


    .header{

        margin-bottom:
            15px;

    }


    .team-name{

        font-size:9px;

        letter-spacing:3px;

    }


    .title{

        font-size:34px;

        letter-spacing:5px;

    }


    .subtitle{

        font-size:10px;

        letter-spacing:2px;

        margin-top:10px;

    }


    .gold-line{

        margin-top:12px;

    }


    .cover{

        width:
            min(290px,76vw);

        max-height:
            53vh;

    }


    .open-button{

        margin-top:20px;

        min-width:170px;

        padding:12px 35px;

        font-size:12px;

        letter-spacing:5px;

    }


    .description{

        font-size:9px;

        letter-spacing:1px;

    }

}

</style>
</head>


<body>


<main class="page">


    <!-- 上部タイトル -->

    <div class="header">

        <div class="team-name">

            KWANSEI GAKUIN UNIVERSITY SKI TEAM

        </div>


        <h1 class="title">

            2026 DIGITAL 部報

        </h1>


        <div class="subtitle">

            関西学院大学体育会スキー競技部

        </div>


        <div class="gold-line"></div>

    </div>



    <!-- 表紙 -->

    <div class="cover-area">

        <img
            src="cover.png"
            class="cover"
            alt="2026 部報 表紙"
            onclick="openBook()"
        >

    </div>



    <!-- OPEN -->

    <a
        href="viewer.html"
        class="open-button"
    >

        OPEN

    </a>



    <!-- 説明 -->

    <div class="description">

        表紙をクリック、またはOPENをクリックしてご覧ください

    </div>


</main>



<script>

function openBook(){

    window.location.href =
        "viewer.html";

}

</script>


</body>
</html>
